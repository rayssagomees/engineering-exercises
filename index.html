<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rayssa Gomes - Exercícios Resolvidos de Engenharia Civil</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <!-- <header>
        <nav>
            <div class="logo">Rayssa Gomes</div>
            <ul class="nav-links">
                <li><a href="#materias">Matérias</a></li>
                <li><a href="#exercicios">Exercícios</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header> -->

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>Domine a engenharia civil com exercícios resolvidos</h1>
            <p>Mais de 500+ exercícios detalhadamente resolvidos para você se preparar para provas e concursos</p>
            <button class="cta-button" onclick="document.getElementById('materias').scrollIntoView({behavior: 'smooth'})">Começar agora</button>
        </div>
    </section>

    <!-- Search Section -->
    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar exercícios por palavra-chave...">
                <button onclick="searchExercicios()"><i class="fi fi-rr-search"></i></button>
            </div>
            <!--<div class="filters">
                <button class="filter-btn active" onclick="filterByDifficulty('todos')">Todos</button>
                <button class="filter-btn" onclick="filterByDifficulty('facil')">Fácil</button>
                <button class="filter-btn" onclick="filterByDifficulty('medio')">Médio</button>
                <button class="filter-btn" onclick="filterByDifficulty('dificil')">Difícil</button>
            </div>-->
        </div>
    </div>

    <!-- Stats Section -->
    <div class="container">
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number">500+</div>
                    <div class="stat-label">Exercícios resolvidos</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">5</div>
                    <div class="stat-label">Matérias</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">10k+</div>
                    <div class="stat-label">Estudantes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">95%</div>
                    <div class="stat-label">Taxa de aprovação</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Matérias Section -->
    <div class="container" id="materias">
        <h2 class="section-title">Matérias disponíveis</h2>
        <div class="materias-grid" id="materiasGrid">
            <!-- As matérias serão carregadas aqui via JavaScript -->
        </div>
    </div>

    <!-- Exercícios List -->
    <div class="container" id="exercicios">
        <div class="exercicios-list" id="exerciciosList">
            <!-- Os exercícios serão carregados aqui via JavaScript -->
        </div>
    </div>

    <!-- Question Detail -->
    <div class="container">
        <div class="question-detail" id="questionDetail">
            <!-- O detalhe da questão será carregado aqui via JavaScript -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Rayssa Gomes. Todos os direitos reservados.</p>
    </footer>

    <script src="assets/components/script.js"></script>
</body>
</html>
